services:
  - type: web
    name: docflow-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: /bin/sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 10000
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: PRESIGNED_URL_EXPIRES_SECONDS
        value: 300
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_FALLBACK_ENABLED
        value: true
      - key: LLM_MODEL
        value: claude-haiku-4-5-20251001
      - key: LLM_BUDGET_USD
        value: 0.15
      - key: LLM_MAX_INPUT_TOKENS
        value: 8000
      - key: LLM_MAX_OUTPUT_TOKENS
        value: 1024
      - key: LLM_MAX_PDF_PAGES
        value: 5
      - key: CONFIDENCE_THRESHOLD
        value: 0.85
      - key: USE_STUB_EXTRACTOR
        value: false
      - key: JOB_MAX_ATTEMPTS
        value: 3
      - key: FORCE_FAIL_FILENAME_CONTAINS
        sync: false
      - key: FORCE_FAIL_UNTIL_ATTEMPT
        sync: false

  - type: worker
    name: docflow-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    plan: starter
    region: oregon
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: PRESIGNED_URL_EXPIRES_SECONDS
        value: 300
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_FALLBACK_ENABLED
        value: true
      - key: LLM_MODEL
        value: claude-haiku-4-5-20251001
      - key: LLM_BUDGET_USD
        value: 0.15
      - key: LLM_MAX_INPUT_TOKENS
        value: 8000
      - key: LLM_MAX_OUTPUT_TOKENS
        value: 1024
      - key: LLM_MAX_PDF_PAGES
        value: 5
      - key: CONFIDENCE_THRESHOLD
        value: 0.85
      - key: USE_STUB_EXTRACTOR
        value: false
      - key: JOB_MAX_ATTEMPTS
        value: 3
      - key: FORCE_FAIL_FILENAME_CONTAINS
        sync: false
      - key: FORCE_FAIL_UNTIL_ATTEMPT
        sync: false
